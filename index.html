<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5132">
<title>Potravinový skener</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #161616;
    --muted: #5b5b5b;
    --line: #e2dfd6;
    --accent: #0f5132;
    --accent-ink: #ffffff;
    --ok: #146c2e;  --ok-bg: #e3f4e7;
    --bad: #b3261e; --bad-bg: #fbe4e2;
    --warn: #8a5a00; --warn-bg: #fff1cc;
    --unk: #4a4a4a; --unk-bg: #ececec;
    --lvl-low: #2e9d4f; --lvl-mod: #e0a100; --lvl-high: #d23b2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121412; --card: #1c1f1c; --ink: #f2f2ef; --muted: #b0b3ad; --line: #2f342f;
      --accent: #5fd08a; --accent-ink: #0b1a10;
      --ok: #7fe0a0; --ok-bg: #173323; --bad: #ff9b92; --bad-bg: #3a1a18;
      --warn: #ffd36b; --warn-bg: #3a2e10; --unk: #cfcfcf; --unk-bg: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0.8rem 0.8rem 3rem; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.2rem 0 0.8rem; }
  header.top h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  .sizer { display: flex; gap: 0.3rem; }
  .sizer button {
    min-width: 2.4rem; height: 2.4rem; border-radius: 0.6rem; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-weight: 700; font-size: 0.9rem; cursor: pointer;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 0.9rem; margin-bottom: 0.8rem; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%;
    min-height: 3.2rem; padding: 0.6rem 1rem; border-radius: 0.9rem; border: 2px solid var(--accent);
    background: var(--card); color: var(--accent); font-size: 1rem; font-weight: 700; cursor: pointer;
    text-align: center; margin-top: 0.6rem; text-decoration: none; font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); min-height: 4rem; font-size: 1.15rem; }
  .btn.small { min-height: 2.4rem; font-size: 0.8rem; padding: 0.3rem 0.7rem; border-width: 1.5px; }
  .btn.danger { border-color: var(--bad); color: var(--bad); }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 0.5rem; }
  .row > * { flex: 1; }
  input[type=text], input[type=tel] {
    width: 100%; font-size: 1.1rem; padding: 0.7rem 0.8rem; border-radius: 0.8rem;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit;
  }
  .hint { color: var(--muted); font-size: 0.8rem; margin: 0.4rem 0 0; }
  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.5rem; font-weight: 700; }
  .group-title { font-size: 0.75rem; color: var(--muted); font-weight: 700; margin: 0.7rem 0 0.35rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
    padding: 0.35rem 0.75rem; font-size: 0.85rem; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .chip.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .chip.add { border-style: dashed; color: var(--accent); }
  .chip.person { font-size: 0.95rem; padding: 0.45rem 0.9rem; }
  .notice { border-radius: 0.8rem; padding: 0.7rem 0.8rem; font-size: 0.85rem; margin-bottom: 0.8rem; background: var(--warn-bg); color: var(--ink); }
  .spinner { display: flex; align-items: center; gap: 0.7rem; font-size: 1rem; }
  .spinner::before {
    content: ""; width: 1.4rem; height: 1.4rem; border-radius: 50%; flex: none;
    border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Výsledek */
  .prod { display: flex; gap: 0.8rem; align-items: flex-start; }
  .prod img { width: 5rem; height: 5rem; object-fit: contain; border-radius: 0.6rem; background: #fff; flex: none; }
  .prod h2 { font-size: 1.45rem; line-height: 1.2; margin: 0 0 0.2rem; }
  .prod .meta { color: var(--muted); font-size: 0.9rem; }
  .src { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--unk-bg); color: var(--unk); margin-top: 0.35rem; }
  .who { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-bottom: 0.6rem; font-size: 0.8rem; color: var(--muted); font-weight: 700; }
  .verdict {
    border-radius: 1rem; padding: 0.9rem 1rem; margin-bottom: 0.8rem; font-weight: 800;
    font-size: 1.5rem; line-height: 1.2; display: flex; gap: 0.6rem; align-items: center;
  }
  .verdict small { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 0.25rem; }
  .verdict .ico { font-size: 2rem; flex: none; }
  .others { margin: -0.3rem 0 0.8rem; font-size: 0.9rem; }
  .others div { padding: 0.15rem 0; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .bad { background: var(--bad-bg); color: var(--bad); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .unk { background: var(--unk-bg); color: var(--unk); }
  .diets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 7.5rem), 1fr)); gap: 0.5rem; }
  .diet { border-radius: 0.8rem; padding: 0.6rem 0.7rem; }
  .diet .dn { font-size: 0.85rem; font-weight: 700; }
  .diet .ds { font-size: 1.15rem; font-weight: 800; margin-top: 0.1rem; }
  .diet .dx { font-size: 0.72rem; font-weight: 500; margin-top: 0.2rem; opacity: 0.95; }
  .diet.mine { outline: 3px solid currentColor; outline-offset: -3px; }
  details.more { margin-top: 0.7rem; }
  details.more summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: 0.9rem; padding: 0.3rem 0; }
  details.more .diets { margin-top: 0.5rem; }
  .allg { font-size: 1rem; margin: 0.3rem 0; }
  .allg b { font-weight: 800; }
  .add { border-left: 0.35rem solid var(--line); padding: 0.35rem 0 0.35rem 0.6rem; margin: 0.45rem 0; }
  .add.h { border-color: var(--lvl-high); }
  .add.m { border-color: var(--lvl-mod); }
  .add b { font-size: 1rem; }
  .add .an { font-size: 0.8rem; color: var(--muted); }
  table.nut { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
  table.nut th, table.nut td { padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; }
  table.nut th:first-child, table.nut td:first-child { text-align: left; }
  table.nut thead th { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table.nut tr.sub td:first-child { padding-left: 1.1rem; color: var(--muted); font-size: 0.95rem; }
  table.nut td.v { font-weight: 800; font-variant-numeric: tabular-nums; }
  .lvl { display: inline-block; width: 0.75rem; height: 0.75rem; border-radius: 50%; margin-left: 0.35rem; vertical-align: middle; }
  .lvl.low { background: var(--lvl-low); } .lvl.moderate { background: var(--lvl-mod); } .lvl.high { background: var(--lvl-high); }
  .lvl-legend { font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem; }
  .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .badge { font-weight: 800; border-radius: 0.6rem; padding: 0.35rem 0.7rem; font-size: 0.9rem; color: #fff; }
  .ns-a { background: #038141; } .ns-b { background: #85bb2f; } .ns-c { background: #fecb02; color: #222; } .ns-d { background: #ee8100; } .ns-e { background: #e63e11; }
  .nova { background: #555; }
  .ingr { font-size: 1.05rem; line-height: 1.5; }
  .ingr mark { background: var(--warn-bg); color: var(--ink); font-weight: 800; padding: 0 0.15rem; border-radius: 0.2rem; }
  .foot { font-size: 0.75rem; color: var(--muted); }
  .hist { list-style: none; padding: 0; margin: 0; }
  .hist li { border-bottom: 1px solid var(--line); }
  .hist li:last-child { border-bottom: 0; }
  .hist button { all: unset; display: flex; justify-content: space-between; gap: 0.6rem; width: 100%; padding: 0.55rem 0; cursor: pointer; font-size: 0.95rem; }
  .hist .t { color: var(--muted); font-size: 0.75rem; flex: none; align-self: center; }
  a { color: var(--accent); }

  /* Živý skener */
  #scanner { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  #scanner video { flex: 1; width: 100%; height: 100%; object-fit: cover; }
  #scanner .frame {
    position: absolute; left: 8%; right: 8%; top: 35%; height: 22%;
    border: 4px solid #fff; border-radius: 1rem; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45); pointer-events: none;
  }
  #scanner .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  #scanner .msg { color: #fff; text-align: center; font-size: 1rem; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #scanner .btn { background: #fff; color: #000; border-color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🔎 Potravinový skener</h1>
    <div class="sizer" aria-label="Velikost písma">
      <button id="fsDown" aria-label="Zmenšit písmo">A−</button>
      <button id="fsUp" aria-label="Zvětšit písmo">A+</button>
    </div>
  </header>

  <div id="dbNotice" class="notice" hidden></div>

  <!-- Domovská obrazovka -->
  <section id="home">
    <div class="card">
      <div id="actions">
        <button class="btn primary" id="btnLive">📷 Naskenovat čárový kód</button>
        <label class="btn" id="btnPhotoLbl">🖼️ Vyfotit čárový kód
          <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        </label>
        <label class="btn" id="btnLabelLbl" hidden>🏷️ Vyfotit etiketu (složení a výživové údaje)
          <input type="file" id="labelInput" accept="image/*" capture="environment" multiple hidden>
        </label>
        <p class="hint" id="labelHint" hidden>Vyfoť složení a tabulku výživových údajů (můžeš vybrat víc fotek najednou). Text přečte Claude.</p>
      </div>
      <form id="manualForm" style="margin-top:0.9rem">
        <div class="row">
          <input type="tel" id="manualCode" inputmode="numeric" pattern="[0-9]*" placeholder="Číslo pod kódem" autocomplete="off">
          <button class="btn" style="margin-top:0;flex:0 0 auto;width:auto">Hledat</button>
        </div>
      </form>
    </div>

    <div class="card">
      <p class="section-title">Profily</p>
      <div class="chips" id="profTabs"></div>
      <form id="profForm" hidden style="margin-top:0.6rem">
        <input type="text" id="profName" maxlength="24" placeholder="Jméno (např. Jana)" autocomplete="off">
        <div class="row">
          <button type="submit" class="btn small">Uložit</button>
          <button type="button" class="btn small" id="profCancel">Zrušit</button>
        </div>
      </form>
      <div id="profEditor"></div>
      <div class="row" style="margin-top:0.4rem">
        <button class="btn small" id="profRename">✏️ Přejmenovat</button>
        <button class="btn small danger" id="profDelete">🗑️ Smazat profil</button>
      </div>
    </div>

    <div class="card" id="histCard" hidden>
      <p class="section-title">Naposledy hledané</p>
      <ul class="hist" id="histList"></ul>
    </div>
  </section>

  <!-- Výsledek -->
  <section id="result" hidden></section>
</div>

<div id="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="bar">
    <div class="msg" id="scanMsg">Namiř kameru na čárový kód</div>
    <div class="row">
      <button class="btn" id="scanPhoto" style="margin-top:0">📸 Vyfotit</button>
      <button class="btn" id="scanTorch" style="margin-top:0" hidden>🔦 Světlo</button>
    </div>
    <button class="btn" id="scanCancel" style="margin-top:0">Zrušit</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
"use strict";

/* ================= Pomocné ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("pskener:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pskener:" + k, JSON.stringify(v)); } catch {} },
};
const OFF = "https://world.openfoodfacts.org";
const FIELDS = [
  "code", "product_name", "product_name_cs", "generic_name", "generic_name_cs", "brands", "quantity",
  "image_front_small_url", "image_front_url", "nutriments", "nutrient_levels", "allergens_tags", "traces_tags",
  "labels_tags", "ingredients_analysis_tags", "ingredients_text", "ingredients_text_cs", "ingredients_text_sk", "ingredients_text_en", "ingredients_text_de",
  "ingredients_text_pl", "ingredients_text_hu", "ingredients_text_fr", "ingredients_text_it", "ingredients_tags",
  "additives_tags", "lang", "nutriscore_grade", "nova_group", "serving_size", "states_tags",
].join(",");

/* ================= Velikost písma ================= */
let fs = store.get("fs", 20);
const applyFs = () => { document.documentElement.style.fontSize = fs + "px"; };
applyFs();
$("fsUp").onclick = () => { fs = Math.min(34, fs + 2); applyFs(); store.set("fs", fs); };
$("fsDown").onclick = () => { fs = Math.max(14, fs - 2); applyFs(); store.set("fs", fs); };

/* ================= Text složení: normalizace a hledání ================= */
// malá písmena, bez diakritiky, sjednocené E-kódy; odstraní fráze, které by dávaly falešné nálezy
function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[-_*]/g, " ")
    .replace(/\be\s?(\d{3,4})/g, "e$1")
    .replace(/kyselin\w* (citronov|mlecn|octov)\w*|citronan\w*|mlecnan\w*|octan\w*|citric acid|citrates?|lactic acid|acetic acid|kakaov\w* masl\w*|cocoa butter|[cz]itronensaure|kakaobutter|milchsaure|essigsaure|cacao butter|beurre de cacao|bez laktozy|bez lepku|bez palmov\w* olej\w*|palm oil free/g, " ")
    .replace(/\s+/g, " ");
}
// seznam [regex, popisek, úroveň]; co se najde, z textu se vyjme, aby se nepočítalo dvakrát
function matchKw(text, list) {
  let t = " " + text + " ";
  const hits = [];
  for (const [re, label, lvl] of list) {
    const g = new RegExp(re.source, "g");
    const t2 = t.replace(g, " ");
    if (t2 !== t) { hits.push({ label, lvl }); t = t2; }
  }
  return hits;
}
const KW_FRUCTOSE = [
  [/glukozo fruktoz\w*|fruktozo glukoz\w*|glucose fructose|fructose glucose|isoglukoz\w*|high fructose|corn syrup/, "glukózo-fruktózový sirup", "bad"],
  [/fruktoz|fructose/, "fruktóza", "bad"],
  [/invertni|invertovan|invert sugar/, "invertní cukr", "bad"],
  [/agav/, "agávový sirup", "bad"],
  [/(^|[^a-z])med(u|em|ov[a-z]*)?([^a-z]|$)|honey/, "med", "bad"],
  [/sorbitol|e420/, "sorbitol (zhoršuje vstřebávání fruktózy)", "warn"],
  [/ovocn\w* (stav|koncentrat|pyre)|juice concentrate|fruit juice|jablecn\w* stav|apple juice/, "ovocná šťáva", "warn"],
  [/jablk|jablec|apple|hrusk|\bpear|\bmango|mangov|datl|\bdates?\b|rozink|raisin|\bfik[uy]?\b/, "ovoce bohaté na fruktózu", "warn"],
];
const KW_SORBITOL = [
  [/sorbitol|e420/, "sorbitol (E420)", "bad"],
  [/mannitol|e421/, "mannitol (E421)", "bad"],
  [/maltitol|e965/, "maltitol (E965)", "bad"],
  [/xylitol|e967/, "xylitol (E967)", "bad"],
  [/isomalt|e953/, "isomalt (E953)", "bad"],
  [/laktitol|lactitol|e966/, "laktitol (E966)", "bad"],
  [/erythritol|erytritol|e968/, "erythritol (E968) – obvykle lépe snášený", "warn"],
  [/svestk|blum|prune/, "švestky (přirozeně obsahují sorbitol)", "warn"],
  [/\bpolyol/, "polyoly", "warn"],
];
const KW_HISTAMINE = [
  [/parmaz|parmigian|parmesan|grana padano|cheddar|emmental|emental|gouda|eidam|\bedam|gorgonzol|roquefort|\bniva\b|plisnov|hermelin|camembert|\bbrie\b|tvaruz|zrajic/, "zrající sýry", "bad"],
  [/salam|klobas|slanin|uzen|chorizo|prosciut|pancett|bacon|smoked/, "uzeniny, trvanlivé maso", "bad"],
  [/kysan\w* zel|kimchi|sauerkraut/, "kysané zelí", "bad"],
  [/tunak|makrel|sardin|ancovi|anchov|\bsled|herring|\btuna\b|mackerel/, "ryby (tuňák, makrela…)", "bad"],
  [/vinn\w* ocet|wine vinegar/, "vinný ocet", "warn"],
  [/\bvin(o|a|em|ny|ne|neho|nym)?\b|\bwine/, "víno", "bad"],
  [/\bpiv(o|a|ni|ovar[a-z]*)\b|\bbeer/, "pivo", "bad"],
  [/(kvasnic|drozd)\w* extrakt|extrakt\w* z (kvasnic|drozd)|yeast extract/, "kvasnicový extrakt", "bad"],
  [/sojov\w* omack|soy sauce|soya sauce|\bmiso\b|tempeh/, "sójová omáčka, fermentovaná sója", "bad"],
  [/\bocet\b|\boctu\b|\boctem\b|vinegar/, "ocet", "warn"],
  [/rajc|tomat/, "rajčata", "warn"],
  [/spenat|spinach/, "špenát", "warn"],
  [/\blil(ek|ku)\b|aubergine|eggplant/, "lilek", "warn"],
  [/avokad|avocado/, "avokádo", "warn"],
  [/kakao|cocoa|cokolad|chocolate/, "kakao, čokoláda", "warn"],
  [/jahod|strawberr/, "jahody", "warn"],
  [/citron|pomeranc|grapefruit|limet|mandarink|citrus|lemon|orange/, "citrusy", "warn"],
  [/ananas|pineapple|papaj|papaya/, "ananas, papája", "warn"],
  [/vlassk\w* orech|walnut/, "vlašské ořechy", "warn"],
  [/lekoric|liquorice|licorice/, "lékořice", "warn"],
  [/fermentovan|fermented/, "fermentované složky", "warn"],
];

/* ================= Přídatné látky (éčka) ================= */
const N = {
  COL: "EU vyžaduje na obalu varování, že může nepříznivě ovlivňovat činnost a pozornost dětí.",
  NIT: "Dusitany a dusičnany: v mase z nich mohou vznikat nitrosaminy; doporučuje se omezovat.",
  SULF: "Siřičitany: alergen, může zhoršit astma.",
  PHOS: "Fosforečnany: vysoký příjem fosfátů není vhodný, hlavně při nemocných ledvinách.",
  POLY: "Polyol: ve větším množství projímavý účinek.",
  SWEET: "Umělé sladidlo.",
  EMUL: "Emulgátor; některé studie naznačují vliv na střevní mikrobiom.",
  RIB: "Zvýrazňovač chuti; nevhodné při dně.",
  CAR: "Může obsahovat 4-MEI, jehož bezpečnost se dál zkoumá.",
  ALG: "U citlivých lidí může vyvolat alergickou reakci.",
  ANTI: "Syntetický antioxidant; doporučuje se omezovat.",
  GLU: "Zvýrazňovač chuti; někteří lidé na něj uvádějí citlivost.",
};
// kód: [název, úroveň h/m/l, poznámka]
const ADD = {

function evalDiet(d, p) {
  if (d.analysis) {
    const v = p[d.analysis];
    if (v === "yes") return { s: "ok", x: "" };
    if (v === "no") return { s: "bad", x: "Obsahuje živočišné složky" };
    if (v === "maybe") return { s: "warn", x: "Některé složky můžou být živočišné" };
    return { s: "unk", x: "Složení není známé" };
  }
  if (d.palm) {
    if (p.palm === "yes") return { s: "bad", x: "Obsahuje palmový olej" };
    if (p.palm === "maybe") return { s: "warn", x: "Může obsahovat palmový olej" };
    if (p.palm === "no") return { s: "ok", x: "Palmový olej není ve složení" };
    return { s: "unk", x: "Složení není známé" };
  }
  if (d.additives) {
    const h = p.additives.filter((a) => a.level === "h"), m = p.additives.filter((a) => a.level === "m");
    if (h.length) return { s: "bad", x: "Obsahuje " + h.map((a) => a.code).join(", ") };
    if (m.length) return { s: "warn", x: "Sporné: " + m.map((a) => a.code).join(", ") };
    if (p.hasIngredients) return { s: "ok", x: p.additives.length ? "Jen éčka bez známých výhrad" : "Bez éček" };
    return { s: "unk", x: "Složení není známé" };
  }
  if (d.kw) {
    const hits = matchKw(p.text, d.kw);
    const bad = hits.filter((h) => h.lvl === "bad"), warn = hits.filter((h) => h.lvl === "warn");
    if (bad.length) return { s: "bad", x: "Obsahuje: " + bad.concat(warn).map((h) => h.label).join(", ") };
    if (warn.length) return { s: "warn", x: "Obsahuje: " + warn.map((h) => h.label).join(", ") };
    if (p.hasIngredients) return { s: "ok", x: "Rizikové složky nenalezeny" };
    return { s: "unk", x: "Chybí složení" };
  }
  const kwHas = d.allergens.some((a) => p.kwAllergens.has(a));
  const has = d.allergens.some((a) => p.allergens.has(a)) || kwHas || (d.codes || []).some((c) => p.additives.some((a) => a.base === c));

  if (d.id === "gluten" && has && freeLbl) return { s: "ok", x: "Označeno jako bezlepkové" };
  if (has) return { s: "bad", x: "Obsahuje " + d.what };
  if (freeLbl) return { s: "ok", x: "Označeno jako „bez“" };
  if (d.allergens.some((a) => p.traces.has(a) || p.kwTraces.has(a))) return { s: "warn", x: "Může obsahovat stopy" };
  if (p.hasIngredients) return { s: "ok", x: "Ve složení nenalezeno" };
  return { s: "unk", x: "Chybí složení – nelze ověřit" };
}

      const words = part.split(" "); let head = "";
      while (words.length && utf8len(head + " " + words[0]) <= maxBytes) head = (head ? head + " " : "") + words.shift();

    if (utf8len(next) > maxBytes) { if (cur) chunks.push(cur); cur = part; } else cur = next;

}
async function fetchJSON(url, ms = 10000) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
async function trMyMemory(q, src) {
  if (!src || src === "auto") throw new Error("need-src");
  const j = await fetchJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${encodeURIComponent(src)}|cs`);
  const t = j && j.responseData && j.responseData.translatedText;
  if (String(j.responseStatus) !== "200" || !t || j.quotaFinished || /MYMEMORY WARNING|QUERY LENGTH|INVALID/i.test(t)) throw new Error("mymemory");
  return t;
}
async function trGoogle(q, src) {
  const j = await fetchJSON(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(src || "auto")}&tl=cs&dt=t&q=${encodeURIComponent(q)}`);
  const t = (j && j[0] || []).map((x) => x && x[0] || "").join("");
  if (!t) throw new Error("google");
  return t;
}
async function translateText(text, src) {
  text = String(text || "").trim(); if (!text) return null;
  const key = (src || "") + "|" + text;
  if (trCache.has(key)) return trCache.get(key);
  const chunks = chunkText(text, 450);
  let out = null;
  for (const fn of [trMyMemory, trGoogle]) {
    try { out = (await Promise.all(chunks.map((c) => fn(c, src)))).join(", "); break; } catch { out = null; }
  }
  if (out) trCache.set(key, out);
  return out;
}
async function translateProduct(p) {
  p.trBusy = true;
  try {
    const src = p.lang && p.lang !== "cs" ? p.lang : "auto";
    const [ingr, name] = await Promise.all([
      p.trIngr && !p.ingredientsCs ? translateText(p.ingredients.replace(/[_*]/g, ""), src) : null,
      p.trName && !p.nameCs ? translateText(p.name, src) : null,
    ]);
    if (ingr) {
      p.ingredientsCs = ingr;
      const t = norm(ingr);
      p.text = norm(ingr + " " + (p.tagsText || "")); // cizojazyčný originál už pro histamin apod. nehodnotíme
      const det = detectAllergens(t);
      det.has.forEach((a) => p.kwAllergens.add(a)); det.traces.forEach((a) => p.kwTraces.add(a));
      p.additives = buildAdditives(p.additives.map((a) => a.code.toLowerCase()).concat(codesFromText(t)));
      if (p.palm !== "yes" && p.palm !== "maybe" && /palm/.test(t)) p.palm = "yes";
    }
    if (name && name.trim().toLowerCase() !== p.name.trim().toLowerCase()) p.nameCs = name.trim();
  } catch {}
  p.trBusy = false; p.trTried = true;
  updateHistoryItem(p);
  if (current === p && !$("result").hidden) { const y = window.scrollY; renderProduct(p, true); window.scrollTo(0, y); }
}

/* ================= Historie ================= */
function addHistory(p) {
  const h = store.get("history", []).filter((x) => !(x.code && x.code === p.code) && !(x.name === p.name && x.source === p.source));
  const { trBusy, ...rest } = pack(p);
  h.unshift({ ...rest, t: Date.now() });
  store.set("history", h.slice(0, 15));
}
function updateHistoryItem(p) {
  const h = store.get("history", []);
  const i = h.findIndex((x) => (p.code && x.code === p.code) || (!p.code && x.name === p.name && x.source === p.source));
  if (i >= 0) { const { trBusy, ...rest } = pack(p); h[i] = { ...rest, t: h[i].t }; store.set("history", h); }
}
function renderHistory() {
  const h = store.get("history", []);
  $("histCard").hidden = !h.length;
  $("histList").innerHTML = h.map((x, i) => `<li><button data-i="${i}"><span>${esc(x.nameCs || x.name)}</span><span class="t">${new Date(x.t).toLocaleDateString("cs-CZ")}</span></button></li>`).join("");
}
$("histList").onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const x = store.get("history", [])[+b.dataset.i]; if (!x) return;
  try { renderProduct(unpack(x)); } catch { showMessage("<p>Záznam se nepodařilo otevřít.</p>"); }
};

/* ================= Databáze Open Food Facts ================= */
let dbOk = null;
async function lookup(code) {
  code = String(code).replace(/\D/g, "");
  if (code.length < 6) { showMessage(`<p>Kód <b>${esc(code) || "–"}</b> je moc krátký. Zkus to znovu.</p>`); return; }
  showBusy("Hledám potravinu " + code + "…");
  let data;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
    const res = await fetch(`${OFF}/api/v2/product/${code}.json?fields=${FIELDS}&lc=cs`, { signal: ctl.signal });
    clearTimeout(tm);
    if (res.status === 404) data = { status: 0 };
    else if (!res.ok) throw new Error("HTTP " + res.status);
    else data = await res.json();
    dbOk = true;
  } catch (err) {
    dbOk = false; updateNotice();
    showMessage(
      `<p style="font-size:1.1rem"><b>Kód ${esc(code)}</b></p>
       <p>Databázi potravin se teď nepodařilo otevřít${aiOk ? " (v této verzi aplikace k ní není přístup)" : " – zkontroluj připojení k internetu"}.</p>
       <a class="btn" href="${OFF}/product/${code}" target="_blank" rel="noopener">🌐 Otevřít produkt v Open Food Facts</a>`,
      aiOk ? labelButtonHtml() : "");
    return;
  }
  if (!data || data.status === 0 || !data.product) {
    showMessage(
      `<p style="font-size:1.1rem"><b>Kód ${esc(code)}</b> v databázi zatím není.</p>
       <p class="hint">Produkt můžeš do Open Food Facts přidat a pomoct tak ostatním.</p>`,
      (aiOk ? labelButtonHtml() : "") +
      `<a class="btn" href="${OFF}/cgi/product.pl?type=add&code=${code}" target="_blank" rel="noopener">➕ Přidat do databáze</a>`);
    return;
  }
  const p = fromOFF(data.product, code);
  addHistory(p);
  renderProduct(p);
}
function labelButtonHtml() {
  return `<label class="btn primary">🏷️ Vyfotit etiketu a nechat ji přečíst
    <input type="file" accept="image/*" capture="environment" multiple hidden data-label-input></label>`;
}

/* ================= Dekódování čárového kódu ================= */
const FORMATS_NATIVE = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"];
// Nejlepší dostupná čtečka: vestavěná v prohlížeči (Android), jinak ZXing-C++ (WebAssembly), jinak null
let detectorP = null;
function getDetector() {
  if (!detectorP) detectorP = (async () => {
    if ("BarcodeDetector" in window) {
      try {
        const sup = await window.BarcodeDetector.getSupportedFormats();
        const fm = FORMATS_NATIVE.filter((f) => sup.includes(f));
        if (fm.includes("ean_13")) return new window.BarcodeDetector({ formats: fm });
      } catch {}
    }
    const API = window.BarcodeDetectionAPI;
    if (API && API.BarcodeDetector) {
      try {
        const d = new API.BarcodeDetector({ formats: FORMATS_NATIVE });
        const c = document.createElement("canvas"); c.width = c.height = 16;
        await Promise.race([d.detect(c), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000))]);
        return d;
      } catch {}
    }
    return null;
  })();
  return detectorP;
}
function zxHints() {
  const hints = new Map(); const F = ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return hints;
}
function zxDecodeCanvas(canvas) {
  if (!window.ZXing) return null;
  try {
    const r = new ZXing.MultiFormatReader(); r.setHints(zxHints());
    const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
    return r.decode(bmp).getText();
  } catch { return null; }
}
async function detectOn(det, source) {
  if (det) { try { const r = await det.detect(source); if (r && r.length) return r[0].rawValue; } catch {} return null; }
  return source instanceof HTMLCanvasElement ? zxDecodeCanvas(source) : null;
}
async function loadImage(file) {
  const url = URL.createObjectURL(file);
  try { const img = new Image(); img.src = url; await img.decode(); return img; }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
function scaledCanvas(img, maxSide) {
  const w = img.naturalWidth || img.videoWidth || img.width, h = img.naturalHeight || img.videoHeight || img.height;
  const s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function decodePhoto(file) {
  const img = await loadImage(file);
  const det = await getDetector();
  for (const side of [2000, 1200, 3000]) {
    const code = await detectOn(det, scaledCanvas(img, side));
    if (code) return code;
  }
  if (det) for (const side of [1400, 900]) { const code = zxDecodeCanvas(scaledCanvas(img, side)); if (code) return code; }
  return null;
}
async function handleBarcodePhoto(f) {
  if (!f) return;
  showBusy("Čtu čárový kód z fotky…");
  try {
    const code = await decodePhoto(f);
    if (code) lookup(code);
    else showMessage(`<p style="font-size:1.1rem">Čárový kód se na fotce nepodařilo přečíst.</p>
      <p class="hint">Vyfoť kód zblízka (ale ostře), bez odlesků a tak, aby byl přes většinu fotky. Nebo napiš čísla pod ním ručně.</p>`,
      `<label class="btn primary">📸 Zkusit znovu<input type="file" accept="image/*" capture="environment" hidden data-photo-input></label>`);
  } catch {
    showMessage(`<p>Fotku se nepodařilo zpracovat. Napiš prosím čísla pod kódem ručně.</p>`);
  }
}
$("photoInput").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; handleBarcodePhoto(f); };
$("result").addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches("[data-photo-input]") && t.files.length) handleBarcodePhoto(t.files[0]);
  if (t.matches("[data-label-input]") && t.files.length) readLabel([...t.files]);
});
$("manualForm").onsubmit = (e) => {
  e.preventDefault(); const v = $("manualCode").value.trim(); if (!v) return;
  $("manualCode").value = ""; $("manualCode").blur(); lookup(v);
};

/* ================= Živé skenování kamerou ================= */
let canLive = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
try {
  const pol = document.permissionsPolicy || document.featurePolicy;
  if (pol && typeof pol.allowsFeature === "function" && !pol.allowsFeature("camera")) canLive = false;
} catch {}
let liveStream = null, liveTimer = null, liveHintTimer = null, liveDone = true, torchOn = false;
function stopLive() {
  liveDone = true;
  clearTimeout(liveTimer); clearTimeout(liveHintTimer); liveTimer = liveHintTimer = null;
  const v = $("video");
  const s = liveStream || v.srcObject;
  if (s && s.getTracks) s.getTracks().forEach((t) => t.stop());
  liveStream = null; v.srcObject = null; torchOn = false;
  $("scanner").hidden = true;
}
function onLiveCode(code) {
  if (liveDone) return;
  stopLive();
  try { navigator.vibrate && navigator.vibrate(80); } catch {}
  lookup(code);
}
function tuneTrack(track) {
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const adv = {};
    if (caps.focusMode && caps.focusMode.includes("continuous")) adv.focusMode = "continuous";
    if (caps.exposureMode && caps.exposureMode.includes("continuous")) adv.exposureMode = "continuous";
    if (Object.keys(adv).length) track.applyConstraints({ advanced: [adv] }).catch(() => {});
    $("scanTorch").hidden = !caps.torch;
  } catch { $("scanTorch").hidden = true; }
}
async function startLive() {
  if (!canLive) { $("photoInput").click(); return; }
  liveDone = false;
  $("scanner").hidden = false; $("scanTorch").hidden = true;
  $("scanMsg").textContent = "Spouštím kameru…";
  const video = $("video");
  try {
    const detP = getDetector(); // čtečka se mezitím připraví
    liveStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
    if (liveDone) { liveStream.getTracks().forEach((t) => t.stop()); liveStream = null; return; }
    video.srcObject = liveStream;
    await video.play();
    tuneTrack(liveStream.getVideoTracks()[0]);
    const det = await detP;
    if (liveDone) return;
    $("scanMsg").textContent = "Drž kód v rámečku, asi 15–20 cm od telefonu";
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let n = 0, lastCode = "", same = 0;
    const tick = async () => {
      if (liveDone) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (video.readyState >= 2 && vw && vh) {
        // střídavě: střed obrazu (kde je rámeček) a celý snímek
        const mode = n++ % 3;
        let sx = 0, sy = 0, sw = vw, sh = vh;
        if (mode !== 2) { sx = vw * 0.04; sw = vw * 0.92; sy = vh * (mode ? 0.2 : 0.3); sh = vh * (mode ? 0.6 : 0.4); }
        const scale = Math.min(1, (det ? 1600 : 1000) / Math.max(sw, sh));
        canvas.width = Math.round(sw * scale); canvas.height = Math.round(sh * scale);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        const code = await detectOn(det, canvas);
        if (code && /\d{6,}/.test(code)) {
          // ZXing v JS se může splést – bez spolehlivé čtečky chceme stejný kód 2×
          if (det) { onLiveCode(code); return; }
          if (code === lastCode && ++same >= 1) { onLiveCode(code); return; }
          lastCode = code; same = 0;
        }
      }
      liveTimer = setTimeout(tick, det ? 30 : 80);
    };
    tick();
    liveHintTimer = setTimeout(() => {
      if (!liveDone) $("scanMsg").textContent = "Nejde to? Oddal telefon, zkus víc světla, nebo klepni na „Vyfotit“.";
    }, 10000);
  } catch (err) {
    stopLive();
    canLive = false; updateLiveButton();
    showMessage(`<p style="font-size:1.1rem">Kameru se nepodařilo spustit.</p>
      <p class="hint">Povol aplikaci přístup ke kameře, nebo použij „Vyfotit čárový kód“ – otevře se běžný fotoaparát.</p>`,
      `<label class="btn primary">🖼️ Vyfotit čárový kód<input type="file" accept="image/*" capture="environment" hidden data-photo-input></label>`);
  }
}
$("btnLive").onclick = startLive;
$("scanCancel").onclick = stopLive;
$("scanPhoto").onclick = () => { stopLive(); $("photoInput").click(); };
$("scanTorch").onclick = async () => {
  const track = liveStream && liveStream.getVideoTracks()[0]; if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch { torchOn = false; }
};
function updateLiveButton() { $("btnLive").hidden = !canLive; if (!canLive) $("btnPhotoLbl").classList.add("primary"); }
updateLiveButton();
getDetector(); // předehřát čtečku, ať první sken proběhne hned

/* ================= Čtení etikety pomocí Clauda (jen ve verzi na claude.ai) ================= */
let aiOk = false, sampleFn = null;
const AI_PROMPT = `Jsi asistent pro lidi s potravinovými intolerancemi. Na přiložených fotkách je obal potraviny (složení, výživové údaje, případně přední strana).
Přečti z fotek, co na nich skutečně je. Nic nedomýšlej – co nejde přečíst, dej null.
Odpověz POUZE jedním JSON objektem bez dalšího textu, v tomto tvaru:
{
 "name": "název výrobku nebo null",
 "brand": "značka nebo null",
 "quantity": "hmotnost/objem nebo null",
 "ingredients": "celé složení v češtině tak, jak je na obalu; alergeny zvýrazněné na obalu obal do podtržítek, např. _pšeničná mouka_; null pokud složení na fotce není",
 "allergens": ["alergeny obsažené ve složení, jen z těchto klíčů: gluten, milk, eggs, nuts, peanuts, soybeans, fish, crustaceans, molluscs, celery, mustard, sesame-seeds, sulphur-dioxide-and-sulphites, lupin"],
 "traces": ["alergeny z upozornění typu 'může obsahovat stopy', stejné klíče"],
 "labels": ["označení přímo na obalu, jen z těchto klíčů: gluten-free, lactose-free, vegan, vegetarian, no-milk"],
 "additives": ["E-kódy všech přídatných látek ve složení malými písmeny, např. e330, e150d – i těch, které jsou uvedené jen názvem (kyselina citronová = e330)"],
 "palm_oil": "yes | no | unknown",
 "vegan": "yes | no | maybe | unknown",
 "vegetarian": "yes | no | maybe | unknown",
 "nutrition_100g": {"kj": číslo|null, "kcal": číslo|null, "fat": číslo|null, "sat": číslo|null, "carbs": číslo|null, "sugars": číslo|null, "fiber": číslo|null, "protein": číslo|null, "salt": číslo|null},
 "note": "krátká česká poznámka (max 2 věty), např. že část etikety nebyla čitelná; jinak null"
}
Lepek obsahují: pšenice (vč. špaldy, kamutu), žito, ječmen, oves a výrobky z nich. Mléko zahrnuje i syrovátku, kasein, laktózu, máslo, smetanu, sýr.`;

async function initAI() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const s = await window.claude.use("sample");
    if (!s) return;
    let imagesOk = true;
    try { if (typeof s.limits === "function") { const l = await s.limits(); imagesOk = !!(l && l.images); } } catch {}
    if (!imagesOk) return;
    sampleFn = s; aiOk = true;
    $("btnLabelLbl").hidden = false; $("labelHint").hidden = false;
    updateNotice();
  } catch {}
}
async function toJpegBlob(file, maxSide = 1600) {
  const img = await loadImage(file);
  const c = scaledCanvas(img, maxSide);
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}
function extractJSON(t) {
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("no-json");
  return JSON.parse(t.slice(a, b + 1));
}
async function readLabel(files) {
  if (!sampleFn) return;
  showBusy("Claude čte etiketu… (chvilku to trvá)");
  try {
    const images = await Promise.all(files.slice(0, 4).map((f) => toJpegBlob(f)));
    const res = await sampleFn(AI_PROMPT, { images, modelTier: "default" });
    const j = extractJSON(res.text || "");
    const nutrIn = j.nutrition_100g || {};
    const nutr = {};
    for (const k of ["kj", "kcal", "fat", "sat", "carbs", "sugars", "fiber", "protein", "salt"]) {
      const v = nutrIn[k]; nutr[k] = v == null || v === "" || isNaN(+v) ? null : +v;
    }
    if (nutr.kcal == null && nutr.kj != null) nutr.kcal = Math.round(nutr.kj / 4.184);
    const tri = (v) => ["yes", "no", "maybe"].includes(v) ? v : "unknown";
    const arr = (v) => Array.isArray(v) ? v.map(String) : [];
    const labels = new Set(arr(j.labels));
    const p = {
      source: "ai", code: "",
      name: j.name || "Potravina z fotky", brand: j.brand || "", quantity: j.quantity || "", image: "",
      ingredients: j.ingredients || "",
      allergens: new Set(arr(j.allergens)), traces: new Set(arr(j.traces)),
      labels, vegan: labels.has("vegan") ? "yes" : tri(j.vegan),
      vegetarian: labels.has("vegetarian") || labels.has("vegan") ? "yes" : tri(j.vegetarian),
      hasIngredients: !!(j.ingredients && String(j.ingredients).trim()),
      nutr, serv: {}, servingSize: "", levels: null, nutriscore: "", nova: "",
      note: j.note || "",
    };
    enrich(p, { addCodes: arr(j.additives), palm: tri(j.palm_oil) === "maybe" ? "unknown" : tri(j.palm_oil) });
    addHistory(p);
    renderProduct(p);
  } catch (err) {
    if (err && err.code === "not_granted") { aiOk = false; $("btnLabelLbl").hidden = true; $("labelHint").hidden = true; }
    const msg = err && err.code === "rate_limited" ? "Moc požadavků najednou – zkus to prosím za chvilku."
      : err && err.code === "not_granted" ? "Čtení etiket nebylo povoleno."
      : "Etiketu se nepodařilo přečíst. Zkus ostřejší fotku se složením i tabulkou.";
    showMessage(`<p style="font-size:1.1rem">${esc(msg)}</p>`, aiOk ? labelButtonHtml() : "");
  }
}
$("labelInput").onchange = (e) => { const fl = [...e.target.files]; e.target.value = ""; if (fl.length) readLabel(fl); };

/* ================= Upozornění na dostupnost databáze ================= */
function updateNotice() {
  const n = $("dbNotice");
  if (dbOk === false) {
    n.hidden = false;
    n.innerHTML = aiOk
      ? "ℹ️ V této verzi se databáze potravin nedá otevřít. Kód přečtu, ale údaje získáš nejlépe tlačítkem <b>Vyfotit etiketu</b>."
      : "⚠️ Databázi potravin se nepodařilo otevřít. Zkontroluj připojení k internetu.";
    if (aiOk) {
      const lbl = $("btnLabelLbl"), box = $("actions");
      lbl.classList.add("primary"); lbl.style.marginTop = "0";
      box.insertBefore(lbl, box.firstChild); lbl.after($("labelHint"));
      $("btnLive").classList.remove("primary"); $("btnPhotoLbl").classList.remove("primary");
    }
  } else n.hidden = true;
}
async function probeDb() {
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`${OFF}/api/v2/product/3017620422003.json?fields=code`, { signal: ctl.signal });
    clearTimeout(tm); dbOk = r.ok || r.status === 404;
  } catch { dbOk = false; }
  updateNotice();
}

renderHistory();
initAI();
probeDb();
})();
